version: '3.8'
services:
  db:
    image: postgres:16
    container_name: NaukaLinux
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: bibibobo
      POSTGRES_DB: NaukaLinuxDB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
